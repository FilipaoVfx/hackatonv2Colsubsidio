worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # DNS interno de Docker. Sin esto, nginx resuelve `backend` UNA vez al cargar
  # la configuración y se queda con esa IP: cada rebuild del backend le da una
  # nueva y el proxy responde 502 hasta que alguien reinicia nginx. Con el
  # resolver + el host en una variable, se vuelve a resolver por petición.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    set $backend backend;

    # Static dashboard (Mission Control)
    root /usr/share/nginx/html;
    index index.html;
    location = /pipeline { try_files /pipeline.html =404; }
    location = /chat { try_files /chat.html =404; }
    location = /studio { try_files /studio.html =404; }
    location / { try_files $uri $uri/ /index.html; }

    # REST API -> Go backend
    location /api/ {
      proxy_pass http://$backend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket -> Go backend (dashboard stream, RA-005)
    location /ws {
      proxy_pass http://$backend:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }
  }
}
