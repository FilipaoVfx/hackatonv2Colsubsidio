services:
  backend:
    build: ./backend
    env_file:
      - .env                 # OPENAI/ELEVENLABS/VAPI/SUPABASE keys (gitignored)
    environment:
      - STEP_MS=150          # dashboard pacing; lower = faster demo
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:1.24-alpine
    depends_on:
      - backend
    ports:
      - "8099:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
